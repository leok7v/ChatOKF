# Package the macOS app as a DMG, and on a v* tag sign, notarize and
# publish it.
#
# This lives in the PUBLIC mirror for the same reason swift.yml does:
# macOS runners are free on a public repo and metered on a private one.
# There is no scripts/ here, so the project is generated by calling
# xcodegen directly.
#
# It does NOT run on every push. swift.yml already builds and tests each
# one, and a second Release build would double the runner time without
# saying anything new. Use the Run workflow button to exercise the
# packaging path after changing this file; a path filter cannot do that
# job, because GitHub requires a push to satisfy the tag filter AND the
# path filter at once, which would leave a release tag doing nothing.
#
# A tag is only a trigger. config/version.xcconfig is the source of truth
# for MARKETING_VERSION and CURRENT_PROJECT_VERSION; bump it and commit
# BEFORE tagging, or the release carries the previous stamp. The version
# stamp phase is a postBuildScript that ships only in the working repo,
# so here the committed fallback is the whole story.
#
# The signed path needs five repository secrets. Without them the tag
# steps fail at the certificate import, which is why the unsigned path is
# guarded separately rather than sharing one build step:
#   MACOS_CERTIFICATE       Developer ID Application .p12, base64 encoded
#   MACOS_CERTIFICATE_PWD   the .p12 export password
#   KEYCHAIN_PASSWORD       any string; scopes the throwaway CI keychain
#   APPLE_ID                the Apple ID that owns the notary submission
#   APPLE_ID_PWD            an app-specific password, NOT the account one
#
# There is deliberately no team secret. The team is read off the imported
# certificate and used for both signing and notarising, so the two can
# never disagree and there is nothing to mistype.
#
# BOTH the app and the DMG are notarized and stapled, in that order. A
# ticket stapled to the DMG alone does not travel with the app once it is
# dragged to /Applications, and the first launch then depends on Apple
# being reachable. Stapling the app first is what makes an offline first
# launch work.

name: macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialised per ref but NEVER cancelled: a run killed between the notary
# submission and the staple leaves a ticket issued for an artifact that
# nothing carries.
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # e5-small.gguf is a Git LFS object and is COPIED INTO THE BUNDLE.
      # Without the pull the .app ships a 130-byte pointer file, builds
      # clean, and fails at first use. The object is restored from the
      # Actions cache keyed by the pointer ids, so a run pulls from LFS
      # only when a tracked file changes.
      - name: LFS ids
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS pull
        run: git lfs pull

      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx
          sw_vers

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          # The DEFAULT keychain and the keychain SEARCH LIST are two
          # different things. find-identity reads the default and would
          # report the identity happily, while xcodebuild searches the
          # list and fails with "no signing certificate ... with a
          # private key was found". Without this line the identity is
          # present and invisible.
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm /tmp/cert.p12
          security list-keychains
          security find-identity -v -p codesigning
          # The team the build signs for is READ OFF THE CERTIFICATE
          # rather than taken on trust from a secret, so the two can
          # never disagree: "no signing certificate matching team ID"
          # is what a wrong team looks like, and it reads like a
          # missing certificate instead. It is also what notarytool is
          # given, so signing and notarising cannot drift apart.
          team=$(security find-identity -v -p codesigning |
                 sed -n 's/.*"Developer ID Application: .*(\(.*\))".*/\1/p' |
                 head -1)
          if [ -z "$team" ]; then
            echo "FAIL: no Developer ID Application identity was imported"
            exit 1
          fi
          echo "SIGN_TEAM=$team" >> "$GITHUB_ENV"

      # Ask Apple whether the credentials work BEFORE paying for a
      # Release build. A 401 here costs seconds; the same 401 after the
      # build costs five minutes, and it is the failure most likely to
      # need a second attempt.
      - name: Notary credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PWD" \
            --team-id "$SIGN_TEAM" \
            --output-format json > /dev/null
          echo "the notary service accepted these credentials"

      # project.yml carries CODE_SIGN_IDENTITY[sdk=macosx*]: "-" on every
      # macOS target so a clone builds without the team. A command-line
      # build setting outranks a target-level one, which is how the tag
      # build reaches Developer ID from the same project file.
      - name: Build (Release, unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          xcodebuild -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "APP=DerivedData/Build/Products/Release/ChatOKF.app" \
            >> "$GITHUB_ENV"

      # Archive and export, which is the path Xcode's own Organizer
      # takes and the one Apple documents for Developer ID. The export
      # step is what strips the debug entitlements that made plain
      # `build` produce a binary notarization refuses, so this does not
      # depend on knowing which build settings inject them.
      - name: Build (Release, signed)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild archive \
            -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -archivePath build/ChatOKF.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$SIGN_TEAM" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          cat > /tmp/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$SIGN_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ChatOKF.xcarchive \
            -exportOptionsPlist /tmp/export.plist \
            -exportPath export
          echo "APP=export/ChatOKF.app" >> "$GITHUB_ENV"

      # Notarization refuses any binary carrying get-task-allow, the
      # debugger-attach entitlement. Stripping it is the export step's
      # job; this asserts the export actually did it, because the only
      # other place the answer appears is a rejection several minutes
      # later, and it names a certificate problem rather than this.
      - name: No debug entitlement survived the build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="$APP"
          ents=$(codesign -d --entitlements :- "$app" 2>/dev/null)
          echo "$ents"
          if printf '%s' "$ents" | grep -q "get-task-allow"; then
            echo "FAIL: the signed app still requests get-task-allow"
            exit 1
          fi
          echo "no get-task-allow in the signed app"

      # The bundled weights are the bulk of the app, so this asserts the
      # LFS pull landed rather than trusting it: a pointer file is 130
      # bytes and the model is tens of megabytes.
      - name: Verify the bundled weights are real
        run: |
          app="$APP"
          e5="$app/Contents/Resources/e5-small.gguf"
          size=$(stat -f%z "$e5")
          echo "e5-small.gguf: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "FAIL: e5-small.gguf is an LFS pointer, not the model"
            exit 1
          fi

      # One submission recipe, called twice: once for the app and once
      # for the DMG that carries it. On rejection it prints Apple's own
      # log, which is the only place the actual reason appears.
      - name: Notary helper
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > /tmp/notarize.sh <<'SH'
          set -eu -o pipefail
          target=$1
          submission=$(mktemp)
          xcrun notarytool submit "$target" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PWD" \
            --team-id "$SIGN_TEAM" \
            --wait \
            --output-format json | tee "$submission"
          id=$(python3 -c "import json;print(json.load(open('$submission'))['id'])")
          status=$(python3 -c "import json;print(json.load(open('$submission'))['status'])")
          echo "Notarization status for $target: $status"
          if [ "$status" != "Accepted" ]; then
            echo "::group::Apple notary log for $id"
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PWD" \
              --team-id "$SIGN_TEAM"
            echo "::endgroup::"
            exit 1
          fi
          SH
          chmod +x /tmp/notarize.sh

      # The app is notarized from a zip because notarytool takes an
      # archive, then the ticket is stapled to the .app itself, which is
      # what the DMG goes on to carry.
      - name: Notarize and staple the app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          app="$APP"
          ditto -c -k --keepParent "$app" /tmp/ChatOKF.zip
          sh /tmp/notarize.sh /tmp/ChatOKF.zip
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Stage app for DMG
        run: |
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/ChatOKF.app
          ln -s /Applications dmg-staging/Applications
          cp LICENSE dmg-staging/LICENSE

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "ChatOKF" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            -fs HFS+ \
            ChatOKF.dmg

      - name: Sign DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --force --sign "Developer ID Application" \
            --timestamp --options runtime \
            ChatOKF.dmg
          codesign -dv --verbose=2 ChatOKF.dmg || true

      - name: Notarize and staple the DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          sh /tmp/notarize.sh ChatOKF.dmg
          xcrun stapler staple ChatOKF.dmg
          xcrun stapler validate ChatOKF.dmg

      # What a first-run user's machine will conclude, asked here instead
      # of in a bug report. Expect: accepted, source=Notarized Developer
      # ID.
      - name: Gatekeeper verdict
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          hdiutil attach ChatOKF.dmg -nobrowse -mountpoint /tmp/dmg
          spctl -a -t exec -vv /tmp/dmg/ChatOKF.app
          hdiutil detach /tmp/dmg

      # Published beside the DMG because the tap reads it from there:
      # github.com/leok7v/ChatOKF.tap turns it into the cask's sha256.
      - name: DMG digest
        run: shasum -a 256 ChatOKF.dmg | tee ChatOKF.dmg.sha256

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChatOKF.dmg
          path: |
            ChatOKF.dmg
            ChatOKF.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ChatOKF.dmg ChatOKF.dmg.sha256

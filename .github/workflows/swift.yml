# Build and test on every push.
#
# This lives in the PUBLIC mirror rather than in the working repo because
# macOS runners are metered on a private repo and free on a public one.
# There is no scripts/ here, so the project is generated by calling
# xcodegen directly.

name: swift

# branches: ['**'] is every branch and NO TAG. Without it a release tag
# runs this suite a second time over the commit main has already tested,
# which is 12 minutes of runner and nothing learned.
on:
  push:
    branches: ['**']
    # A commit that touches only the release recipe, the cask or prose
    # cannot change what this suite tests, and the suite costs twelve
    # minutes. Every path here is one no Swift target reads.
    paths-ignore:
      - '.github/workflows/dmg.yml'
      - '.github/workflows/pages.yml'
      - 'www/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      # e5-small.gguf is a Git LFS object. The checkout leaves a pointer;
      # the object is restored from the Actions cache keyed by the pointer
      # ids, so a run pulls from LFS only when a tracked file changes.
      - name: LFS ids
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS pull
        run: git lfs pull
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app
        run: |
          xcodebuild -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          xcodebuild -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test

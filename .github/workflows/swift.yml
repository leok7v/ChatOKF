# Build and test on every push.
#
# This lives in the PUBLIC mirror rather than in the working repo because
# macOS runners are metered on a private repo and free on a public one.
# There is no scripts/ here, so the project is generated by calling
# xcodegen directly.

name: swift

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # e5-small.gguf is a Git LFS object; without this the checkout
          # leaves a pointer file and the app bundles that instead.
          lfs: true
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app
        run: |
          xcodebuild -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          xcodebuild -project ChatOKF.xcodeproj -scheme ChatOKF \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test
